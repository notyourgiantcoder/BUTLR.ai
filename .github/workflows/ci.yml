name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore windows/Butlr.sln

      - name: Build solution
        run: dotnet build windows/Butlr.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test windows/Butlr.sln -c Release --no-build --logger "console;verbosity=normal"
